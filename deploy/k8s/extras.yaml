---
# Autoscaling for the stateless entry points
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api-gateway }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway }
  minReplicas: 2
  maxReplicas: 6
  metrics: [ { type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } } ]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: order-service }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: order-service }
  minReplicas: 2
  maxReplicas: 6
  metrics: [ { type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } } ]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api-gateway }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: api-gateway } }
---
# Only the gateway is exposed to the outside world
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: shopstream }
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: api-gateway, port: { number: 8080 } } } }
---
# Zero trust inside the namespace: business services accept traffic ONLY from the gateway (and, for the saga, nobody else needs HTTP).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: services-only-from-gateway }
spec:
  podSelector: { matchExpressions: [ { key: app, operator: In, values: [order-service, inventory-service, payment-service] } ] }
  policyTypes: [ Ingress ]
  ingress:
    - from: [ { podSelector: { matchLabels: { app: api-gateway } } } ]
      ports: [ { port: 8081 }, { port: 8082 }, { port: 8083 } ]
    - from: [ { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } } ]   # Prometheus scrapes the management ports
      ports: [ { port: 9081 }, { port: 9082 }, { port: 9083 } ]
