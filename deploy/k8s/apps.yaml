# Generated shape: one Deployment + Service per app, see deploy/k8s/README in the main README.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels: { app: api-gateway, part-of: shopstream }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app: api-gateway, part-of: shopstream }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9080", prometheus.io/path: /actuator/prometheus }
    spec:
      terminationGracePeriodSeconds: 45          # > spring.lifecycle.timeout-per-shutdown-phase (30s)
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api-gateway
          image: ghcr.io/your-org/shopstream-api-gateway:latest      # replaced by kustomize "images"
          ports:
            - { name: http, containerPort: 8080 }
            - { name: mgmt, containerPort: 9080 }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: docker }   # reuses the container hostnames: postgres, kafka:29092, redis, keycloak, jaeger
            - { name: CONFIG_SERVER_URL, value: "http://config-server:8888" }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: shopstream-secrets, key: DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: shopstream-secrets, key: DB_PASSWORD } } }
            - { name: CONFIG_USER, valueFrom: { secretKeyRef: { name: shopstream-secrets, key: CONFIG_USER } } }
            - { name: CONFIG_PASSWORD, valueFrom: { secretKeyRef: { name: shopstream-secrets, key: CONFIG_PASSWORD } } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          startupProbe:   { httpGet: { path: /actuator/health/liveness, port: 9080 }, periodSeconds: 5, failureThreshold: 36 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness, port: 9080 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 9080 }, periodSeconds: 5 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, labels: { app: api-gateway } }
spec:
  selector: { app: api-gateway }
  ports: [ { name: http, port: 8080, targetPort: http } ]
