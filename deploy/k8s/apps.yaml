apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  labels: { app: config-server, part-of: shopstream }
spec:
  replicas: 1
  selector: { matchLabels: { app: config-server } }
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app: config-server, part-of: shopstream }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8888", prometheus.io/path: /actuator/prometheus }
    spec:
      terminationGracePeriodSeconds: 45          # > spring.lifecycle.timeout-per-shutdown-phase (30s)
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: config-server
          image: ghcr.io/your-org/shopstream-config-server:latest      # replaced by kustomize "images"
          ports:
            - { name: http, containerPort: 8888 }
          env:
            - { name: CONFIG_REPO, value: "file:/config-repo" }
            - { name: CONFIG_USER, valueFrom: { secretKeyRef: { name: shopstream-secrets, key: CONFIG_USER } } }
            - { name: CONFIG_PASSWORD, valueFrom: { secretKeyRef: { name: shopstream-secrets, key: CONFIG_PASSWORD } } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          startupProbe:   { httpGet: { path: /actuator/health/liveness, port: 8888 }, periodSeconds: 5, failureThreshold: 36 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness, port: 8888 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8888 }, periodSeconds: 5 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: config-repo, mountPath: /config-repo, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: config-repo, configMap: { name: config-repo } }
---
apiVersion: v1
kind: Service
metadata: { name: config-server, labels: { app: config-server } }
spec:
  selector: { app: config-server }
  ports: [ { name: http, port: 8888, targetPort: http } ]
