apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shopstream
resources: [ apps.yaml, extras.yaml ]
configMapGenerator:
  - name: config-repo            # the Spring Cloud Config files, served by config-server
    files:
      - ../../config-repo/application.yml
      - ../../config-repo/application-docker.yml
      - ../../config-repo/api-gateway.yml
      - ../../config-repo/api-gateway-docker.yml
      - ../../config-repo/order-service.yml
      - ../../config-repo/order-service-docker.yml
      - ../../config-repo/inventory-service.yml
      - ../../config-repo/inventory-service-docker.yml
      - ../../config-repo/payment-service.yml
      - ../../config-repo/payment-service-docker.yml
images:                          # set your registry and the tag built by CI
  - { name: ghcr.io/your-org/shopstream-api-gateway, newTag: latest }
  - { name: ghcr.io/your-org/shopstream-order-service, newTag: latest }
  - { name: ghcr.io/your-org/shopstream-inventory-service, newTag: latest }
  - { name: ghcr.io/your-org/shopstream-payment-service, newTag: latest }
  - { name: ghcr.io/your-org/shopstream-config-server, newTag: latest }
